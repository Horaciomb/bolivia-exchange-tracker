[project]
name = "bolivia-exchange-tracker"
version = "0.1.0"
description = "Pipeline ETL + API REST de cotizaciones del dolar en Bolivia (oficial y binance)."
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# E/W: pycodestyle, F: pyflakes, I: isort, UP: pyupgrade, B: bugbear
select = ["E", "W", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# La cobertura no va en addopts a proposito: `pytest` local queda rapido y el
# reporte se pide explicitamente con `pytest --cov=src` (el CI lo hace siempre).
addopts = "-v"

[tool.coverage.run]
source = ["src"]

[tool.coverage.report]
# Umbral por debajo del valor actual (99%), para que un descuido puntual no
# frene el CI pero una caida real si. Subirlo cuando el margen sobre.
fail_under = 90
show_missing = true
exclude_also = [
    # Entry point del pipeline: se prueba main(), no la invocacion por CLI.
    'if __name__ == .__main__.:',
]
